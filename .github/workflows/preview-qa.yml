name: WordKing preview QA

on:
  push:
    branches:
      - preview/practice-results-folder-tools-20261104
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check assets/app.js
      - name: Test suite
        run: npm --prefix config test
